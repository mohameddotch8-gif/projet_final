<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Gym - Réservation de Service</title>
    <link rel="stylesheet" href="css/leon.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Work Sans', sans-serif;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #2c4755;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
        }

        .service {
            background-color: #f6f6f6;
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .service h3 {
            color: #10cab7;
        }

        .footer {
            background-color: #2c4755;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 40px;
        }

        .form-section {
            margin-bottom: 20px;
        }

        .form-section label {
            display: block;
            margin-bottom: 5px;
        }

        .form-section input,
        .form-section select {
            padding: 8px;
            width: 100%;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .form-section button {
            padding: 10px 20px;
            background-color: #10cab7;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .form-section button:hover {
            background-color: #089e8b;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Galaxy Gym - Réservez votre service</h1>
    </div>

    <div class="container">
        <div class="form-section">
        <form method="POST" action="book_service.php">
            <h2>Entrez vos informations</h2>
            <label for="name">Nom</label>
            <input type="text" id="name" name="name" placeholder="Entrez votre nom" required>
            <label for="surname">Prénom</label>
            <input type="text" id="surname" name ="surname" placeholder="Entrez votre prénom" required>
           
            <label for="sport">Choisissez votre sport</label>
            <select id="sport" name="sport">
                <option value="" disabled selected>Sélectionnez un sport</option>
                <option value="musculation">Musculation</option>
                <option value="fitness">Fitness</option>
                <option value="cardio">Cardio Training</option>
            </select>
            <button type="button" onclick="showSportDetails()">Soumettre</button>
        </div>
        <div id="service-details"></div>
    </div>
    <input type="submit" disabled id="b"  value="Réserver maintenant" onclick="bookService('${sport}')">
    <div class="footer">
        <p>&copy; 2025 Galaxy Gym. Tous droits réservés.</p>
    </div>
</div>



    <script>
        function alpha(ch)
        {ch=ch.toUpperCase();
         i=0;
         while(i<ch.length && (ch[i]>="A" && ch[i]<="Z" ||ch[i]==" "))
            i++;
        return i==ch.length;
        }
        const services = {
            musculation: {
                name: "Musculation",
                price: 50,
                adress: "Tunis ,Nabeul"
            },
            fitness: {
                name: "Fitness",
                price: 100,
                adress: "Tunis , Nabeul"
            },
            cardio: {
                name: "Cardio Training",
                price: 70,
                adress: "Tunis ,Nabeul"
            }
        };

        function showSportDetails() {
            const name = document.getElementById("name").value;
            const surname = document.getElementById("surname").value;
            const sport = document.getElementById("sport").value;
            const choix=document.getElementById("sport").selectedIndex;
            

            if (name.length==0 || surname.length==0 || choix==0 || !alpha(name)|| !alpha(surname)) {
                alert("Veuillez remplir tous les champs.");
                return false;
            }
           
            document.getElementById("b").disabled=false;
            const service = services[sport];
            const serviceDetailsDiv = document.getElementById("service-details");
 
            serviceDetailsDiv.innerHTML = `
                <h2>Détails de la réservation</h2>
                <p>Nom : ${name} ${surname}</p>
                <p>Sport : ${service.name}</p>
                <p>Adresse : ${service.adress}</p>
                <p>Prix : ${service.price} DT</p>
               
                
            `;
            
        }

        
        

        function bookService(sport) {
          alert(
  `Bienvenue ${name} ${surname}, vous avez inscrit ${services[sport].name} ` +
  `${services[sport].price} DT dans cette date ${date_reservation}`
);
        }
    </script>
    
    </form>
</body>

</html>
